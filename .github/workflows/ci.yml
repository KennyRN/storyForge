name: CI

# The tests on every push and pull request: the Mac and Windows runs both must pass (Windows is blocking since
# Brief 22). The interface tests in Chromium on Windows are reported only until their failures are triaged.
# No built-app scripts here: they stay on the author's Mac.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Test (TypeScript)
        run: npm test

      - name: Test (Rust)
        if: ${{ !cancelled() }} # run even when the TypeScript tests failed, so the Windows list is complete
        run: cargo test --workspace --no-fail-fast
        working-directory: src-tauri

  # The interface tests (test/ui) in Chromium on Windows: the nearest automatic check of WebView2's drawing. Reported only.
  ui-chromium:
    name: interface tests (Chromium, windows-latest)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Interface tests
        run: npm run test:ui
        env:
          SF_BROWSER: chromium
