name: CI

# The tests on every push and pull request: the Mac run must pass; the Windows run is reported but does not
# block until Brief 22 (it is an early warning of where the core trips up on Windows). No built-app scripts
# here: they stay on the author's Mac.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.report-only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            report-only: false
          - os: windows-latest
            report-only: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Test (TypeScript)
        run: npm test

      - name: Test (Rust)
        run: cargo test --workspace
        working-directory: src-tauri
