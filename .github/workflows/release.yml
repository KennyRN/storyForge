name: Release

# On a release tag (v*), GitHub builds the universal Mac app, signs it with Apple's free ad-hoc signature
# (the "-" identity in tauri.conf.json: no Apple account, no secrets), attests every download with GitHub's
# build-provenance action, and makes a DRAFT release. It never publishes: the author does that himself.
# A manual run makes a draft of the current version, to try the pipeline.
# The Windows job (Brief 22) adds an unsigned, per-user installer labelled as a preview, and the sample project, to the same draft.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: Mac build (draft release)
    runs-on: macos-latest
    permissions:
      contents: write      # the draft release and its files
      id-token: write      # the attestation's signing identity
      attestations: write  # the attestation itself
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Rust targets for the universal build
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: The version, and the release notes (install notes, then this version's changelog)
        id: notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "body<<NOTES_EOF"
            echo "## Installing on a Mac"
            echo
            echo "This app is signed with an ad-hoc signature, not by Apple, so macOS will not open it the first time."
            echo "Open the .dmg, drag storyForge to Applications, then open it once. When macOS refuses, go to"
            echo "System Settings > Privacy & Security, scroll to the message about storyForge and choose **Open Anyway**."
            echo "It asks once; after that the app opens normally. See the README for how to check a download is genuine."
            echo
            echo "## Windows preview"
            echo
            echo "The Windows version is a **preview**: please keep backups of your writing. Run \`storyForge_${VERSION}_windows-preview_x64-setup.exe\`; Windows says \"Windows protected your PC\" because the installer is unsigned, so choose **More info**, then **Run anyway**. It installs for your own account and fetches Microsoft's WebView2 if it is missing."
            echo "Try it on \`storyForge-sample-project.zip\` first, using the checklist: https://github.com/${{ github.repository }}/blob/v${VERSION}/docs/windows-test.md"
            echo
            echo "## What changed in $VERSION"
            echo
            awk -v v="## $VERSION" 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign (ad hoc) and draft the release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.notes.outputs.version }}
          releaseName: storyForge ${{ steps.notes.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin --bundles dmg # the .dmg only: no updater, so no .app.tar.gz (decision 171)

      - name: Attest the downloads
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    name: Windows preview build (added to the draft release)
    needs: mac # the Mac job makes the draft; this one adds to it
    runs-on: windows-latest
    permissions:
      contents: write      # adding files to the draft release
      id-token: write      # the attestation's signing identity
      attestations: write  # the attestation itself
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: The version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build the installer and add it to the draft release (unsigned, per user, labelled as a preview)
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: storyForge ${{ steps.version.outputs.version }}
          releaseDraft: true
          prerelease: false
          assetNamePattern: storyForge_[version]_windows-preview_[arch]-setup[ext]
          args: --bundles nsis

      - name: Attest the installer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*.exe

      - name: "The sample project (invented text, made from scratch, no test files)"
        shell: pwsh
        run: |
          node scripts/sample-project.mjs "sample/storyForge sample project"
          Compress-Archive -Path "sample/storyForge sample project" -DestinationPath storyForge-sample-project.zip

      - name: Attest the sample project
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: storyForge-sample-project.zip

      - name: Add the sample project to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          gh api --method POST -H "Content-Type: application/zip" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=storyForge-sample-project.zip" \
            --input storyForge-sample-project.zip
