<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Project cards mock-up</title>
<link rel="stylesheet" href="../../src/ui/theme/index.css">
<style>
/* A throwaway mock-up (Brief 16, H1). Not app code: it borrows the app's theme and draws the cards as proposed. */
html, body { margin: 0; height: 100%; background: var(--purpose-panel-bg); color: var(--purpose-text); font: 13px/1.4 "SN Pro", Arial, sans-serif; }
main { height: 100%; box-sizing: border-box; padding: 28px 28px 20px; display: flex; flex-direction: column; gap: 18px; overflow: auto; }
h1 { margin: 0; font-size: 28px; font-weight: 600; text-align: center; }
.actions { display: flex; gap: 8px; justify-content: center; }
.btn { border: 1px solid var(--purpose-border); border-radius: 6px; background: var(--purpose-raised-bg); color: var(--purpose-text); padding: 5px 12px; font: inherit; }
.btn.primary { background: var(--purpose-accent); color: var(--purpose-text-on-accent); border-color: transparent; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; align-content: start; max-width: 1100px; width: 100%; margin: 0 auto; }
.card { position: relative; display: flex; flex-direction: column; text-align: left; padding: 0; border: 2px solid transparent; border-radius: 10px; background: var(--purpose-editor-bg); color: inherit; font: inherit; overflow: hidden; }
.card:hover, .card.hover { border-color: var(--purpose-accent); }
.card.dim { opacity: .5; }
.card.dim:hover { border-color: transparent; }
.img { aspect-ratio: 3 / 4; background: var(--purpose-panel-bg); display: grid; place-items: center; margin: 8px 8px 0; border-radius: 6px; overflow: hidden; }
.img img { width: 100%; height: 100%; object-fit: var(--fit, cover); display: block; }
.img svg { width: 44px; height: 44px; color: var(--purpose-decoration); }
.text { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.path { color: var(--purpose-text-muted); font-size: 12px; white-space: nowrap; }
.state { color: var(--purpose-text); font-size: 12px; font-weight: 600; }
.menu { position: absolute; z-index: 5; background: var(--purpose-raised-bg); border-radius: 6px; box-shadow: var(--floating-shadow); padding: 4px 0; min-width: 150px; }
.menu div { padding: 4px 10px; color: var(--purpose-text-muted); }
.menu div.sel { background: var(--purpose-accent); color: var(--purpose-text-on-accent); }
</style>
</head>
<body>
<main>
  <h1>storyForge</h1>
  <div class="actions"><span class="btn primary">Open Project…</span><span class="btn">New Project…</span></div>
  <div class="grid" id="grid"></div>
</main>
<script>
const q = new URLSearchParams(location.search);
const n = Number(q.get("n") || 3);
document.documentElement.style.setProperty("--fit", q.get("fit") || "cover");
const art = (a, b, label, ratio) => "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${ratio === "wide" ? "400 300" : ratio === "square" ? "300 300" : "300 450"}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="50%" y="50%" fill="#2d353b" font-family="Arial" font-size="26" font-weight="700" text-anchor="middle">${label}</text></svg>`);
const photo = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="No cover"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg>`;
const all = [
  { k: "series", name: "The Lantern Cycle", path: "~/Storytelling/Lantern", img: art("#a7c080", "#7fbbb3", "Series cover", "tall") },
  { k: "novel", name: "Book 1: The Harbour Wakes", path: "~/Storytelling/Harbour", img: art("#dbbc7f", "#e69875", "First novel", "tall") },
  { k: "none", name: "A Quiet Standalone", path: "~/Documents/Novels/Quiet" },
  { k: "wide", name: "Wide Cover Example", path: "/Volumes/Archive/Projects/Wide", img: art("#d699b6", "#7fbbb3", "Wide image", "wide") },
  { k: "long", name: "The Extraordinarily Long Title of a Series Whose Name Keeps Going", path: "~/Library/Mobile Documents/com~apple~CloudDocs/Writing/Very/Deep/Folders/Here/Project", img: art("#83c092", "#a7c080", "Series cover", "tall") },
  { k: "gone", name: "Old Draft", path: "/Volumes/Backup Drive/Old Draft", state: "Not found" },
  { k: "notproj", name: "Notes", path: "~/Documents/Notes", state: "Not a project" },
  { k: "novel2", name: "Marsh Light", path: "~/Storytelling/Marsh", img: art("#7fbbb3", "#d699b6", "First novel", "tall") },
  { k: "none2", name: "Short Stories", path: "~/Storytelling/Shorts" },
  { k: "series2", name: "The Salt Road", path: "~/Storytelling/Salt", img: art("#e69875", "#dbbc7f", "Series cover", "tall") },
];
const only = q.get("only");
let list = only ? only.split(",").map((k) => all.find((c) => c.k === k)) : all.slice(0, n);
const grid = document.getElementById("grid");
const hoverKey = q.get("hover");
const menuKey = q.get("menu");
for (const c of list) {
  const card = document.createElement("button");
  card.className = "card" + (c.state ? " dim" : "") + (hoverKey === c.k ? " hover" : "");
  card.setAttribute("aria-label", c.state ? `${c.name}, ${c.state}` : c.name);
  card.title = c.path.replace(/^~/, "/Users/kenny");
  const mid = c.path.length > 34 ? c.path.slice(0, 15) + "…" + c.path.slice(-17) : c.path;
  card.innerHTML = `<div class="img">${c.img ? `<img alt="" src="${c.img}">` : photo}</div><div class="text"><span class="name">${c.name}</span><span class="path">${mid}</span>${c.state ? `<span class="state">${c.state}</span>` : ""}</div>`;
  if (menuKey === c.k) {
    const m = document.createElement("div");
    m.className = "menu";
    m.style.left = "60px"; m.style.top = "120px";
    m.innerHTML = `<div class="sel">Remove from List</div>`;
    card.append(m);
    card.style.overflow = "visible";
  }
  grid.append(card);
}
</script>
</body>
</html>
