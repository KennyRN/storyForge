[package]
name = "storyforge-fs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "storyForge's file-system side: path rules, the write guard, containment, and the disk operations. No Tauri dependency, so it builds and tests anywhere."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
