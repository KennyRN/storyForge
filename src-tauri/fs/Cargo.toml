[package]
name = "storyforge-fs"
version = "1.7.0"
edition = "2021"
license = "MIT"
authors = ["volcanicMole"]
publish = false
description = "storyForge's file-system side: path rules, the write guard, containment, and the disk operations. No Tauri dependency, so it builds and tests anywhere."

[[bin]]
name = "sf-bridge"
path = "src/bin/sf-bridge.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }

# Windows only, never compiled on the Mac: the exclusive move (Brief 22, §3.4).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Shutdown", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"
notify = "8"
